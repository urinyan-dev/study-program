<!DOCTYPE html>
<html>
<head><title>フォーム練習</title></head>
<body>
  <input type="text" id="nameInput" placeholder="名前を入力">
  <input type="number" id="scoreInput" placeholder="点数を入力">
  <button id="submitBtn">登録</button>

  <ul id="resultList"></ul>

  <script>
    const judge = (score) => {
      score = Number(score)
      if (score >= 70) {
        return '合格';
      } else {
        return '不合格';
      }
    };
    const resultList = document.querySelector('#resultList');
    const btn = document.querySelector('#submitBtn');
    btn.addEventListener('click', () => {
      const name = document.querySelector('#nameInput');
      const score = document.querySelector('#scoreInput');
      console.log(`名前：${name.value}`);
      console.log(`点数：${score.value}`); 

      const newLi = document.createElement('li');
      newLi.textContent = `名前：${name.value} 点数：${score.value} 判定：${judge(score.value)}`
      resultList.appendChild(newLi);

      name.value = '';
      score.value = '';
    })
  </script>
</body>
</html>
<!-- 
「登録」ボタンが押されたら、nameInputとscoreInputの値を取得する
「名前：〇〇　点数：△△」という形式のテキストを作る
それを<li>要素としてresultListの中に追加する（新しく登録するたびに、下にどんどん増えていく想定）
登録が終わったら、両方の入力欄を空にする（次の入力をしやすくするため） -->
